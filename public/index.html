<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>磁力链接转 Torrent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #f6f8fa; color: #1f2328; }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .sub { color: #57606a; font-size: 13px; margin-bottom: 16px; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; }
    label { display: block; font-size: 13px; color: #424a53; margin-bottom: 6px; font-weight: 500; }
    input[type=text] { width: 100%; padding: 10px 12px; font-size: 13px; border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 12px; font-family: ui-monospace, monospace; box-sizing: border-box; }
    button { padding: 8px 20px; font-size: 13px; background: #2da44e; color: #fff; border: 1px solid rgba(27,31,36,0.15); border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover:not(:disabled) { background: #2c974b; }
    button:disabled { background: #81b196; cursor: not-allowed; }
    #result { margin-top: 14px; padding: 12px; background: #f6f8fa; border-radius: 6px; word-break: break-all; border: 1px solid #d0d7de; font-size: 13px; display: none; }
    .ok { color: #1a7f37; font-weight: 600; }
    .err { color: #cf222e; font-weight: 600; }
    .download-btn { display: inline-block; margin: 6px; padding: 8px 14px; background: #0969da; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 12px; cursor: pointer; border: none; }
    .download-btn:hover { background: #0759b5; }
    .download-btn.alt { background: #6e7781; }
    .download-btn.green { background: #2da44e; }
    .url-box { margin-top: 8px; padding: 10px; background: #fff; border: 1px solid #d0d7de; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; line-height: 1.6; }
    .copy-btn { padding: 3px 10px; font-size: 11px; background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; border-radius: 4px; cursor: pointer; margin-left: 6px; }
    .hint { margin-top: 8px; padding: 10px; background: #fff4e5; border: 1px solid #ffd591; border-radius: 6px; font-size: 12px; color: #8a5300; line-height: 1.6; }
    .examples { margin-top: 10px; font-size: 11px; color: #57606a; }
    .examples code { background: #eaeef2; padding: 1px 5px; border-radius: 3px; }
    .progress-bar { width: 100%; height: 4px; background: #d0d7de; border-radius: 2px; overflow: hidden; margin: 6px 0; display: none; }
    .progress-bar-fill { height: 100%; background: #2da44e; width: 0; animation: progress 1.5s infinite; }
    @keyframes progress { 0% { width: 0; margin-left: 0; } 50% { width: 70%; margin-left: 15%; } 100% { width: 0; margin-left: 100%; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 磁力链接转 Torrent</h1>
    <div class="sub">粘贴磁力链接或 info hash，获取 .torrent 文件</div>
    
    <div class="card">
      <label for="magnet">输入磁力链接 / info hash</label>
      <input id="magnet" type="text" placeholder="magnet:?xt=urn:btih:4A3F5E08BCEF825718EDA30637230585E3330599&dn=ubuntu" />
      <button id="btn" onclick="convert()">开始转换</button>
      <div class="progress-bar" id="progressBar"><div class="progress-bar-fill"></div></div>
      <div class="examples">
        测试: <code>4A3F5E08BCEF825718EDA30637230585E3330599</code> 或 <code>A987EB182DC1CE638FEF046050B942A60FFE9025</code>
      </div>
      <div id="result"></div>
    </div>

    <div class="hint" style="margin-top: 14px;">
      💡 <strong>下载提示</strong>：如果点击按钮后没有弹出下载，请用鼠标<strong>右键→在新标签页中打开</strong>下载链接，或复制下方URL到新标签页。
    </div>
  </div>
  
  <script>
    function parseMagnet(input) {
      input = (input || '').trim();
      if (/^[a-fA-F0-9]{40}$/.test(input)) return input.toUpperCase();
      const m = input.match(/xt=urn:btih:([a-fA-F0-9]{40})/);
      if (m) return m[1].toUpperCase();
      return null;
    }
    
    async function downloadBlob(hash) {
      const url = '/api/torrent?hash=' + hash;
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const blob = await resp.blob();
      const dl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = dl;
      a.download = hash + '.torrent';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(dl); document.body.removeChild(a); }, 1000);
    }
    
    async function convert() {
      const raw = document.getElementById('magnet').value;
      const hash = parseMagnet(raw);
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      const progress = document.getElementById('progressBar');
      
      result.innerHTML = '';
      result.style.display = 'block';
      
      if (!hash) {
        result.innerHTML = '<span class="err">✗ 请输入有效的磁力链接或40位 info hash</span>';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = '转换中...';
      progress.style.display = 'block';
      
      try {
        const downloadUrl = '/api/torrent?hash=' + hash;
        const resp = await fetch(downloadUrl, { cache: 'no-store' });
        
        if (!resp.ok) {
          result.innerHTML = '<span class="err">✗ 转换失败 (HTTP ' + resp.status + ')</span><br/><br/>冷门资源或刚发布的资源可能尚未被公共缓存收录。';
          return;
        }
        
        const blob = await resp.blob();
        const sizeKB = (blob.size / 1024).toFixed(1);
        const fullUrl = window.location.origin + downloadUrl;
        
        result.innerHTML = `
          <span class="ok">✓ 转换成功</span> (${sizeKB} KB, hash: ${hash.substring(0, 8)}...)
          <div style="margin-top: 10px;">
            <a class="download-btn green" href="${downloadUrl}" download="${hash}.torrent" target="_blank">⬇ 方式1: 新标签页下载</a>
            <button class="download-btn" onclick="downloadBlob('${hash}')">⬇ 方式2: Blob下载</button>
            <form action="${downloadUrl}" method="GET" target="_blank" style="display: inline;">
              <button type="submit" class="download-btn alt">⬇ 方式3: 表单提交</button>
            </form>
          </div>
          <div class="url-box">
            下载链接: <a href="${fullUrl}" target="_blank" rel="noopener noreferrer">${fullUrl}</a>
            <button class="copy-btn" onclick="copyText('${fullUrl}')">复制</button>
          </div>
          <div class="url-box">
            curl: <code>curl "${fullUrl}" -o ${hash}.torrent</code>
            <button class="copy-btn" onclick="copyText('curl &quot;${fullUrl}&quot; -o ${hash}.torrent')">复制</button>
          </div>
        `;
      } catch(err) {
        result.innerHTML = '<span class="err">✗ 错误: ' + err.message + '</span>';
      } finally {
        btn.disabled = false;
        btn.textContent = '开始转换';
        progress.style.display = 'none';
      }
    }
    
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); alert('已复制到剪贴板!'); }
      catch(e) { alert('复制失败，请手动选中复制: ' + text); }
    }
    
    document.getElementById('magnet').addEventListener('keypress', (e) => { if (e.key === 'Enter') convert(); });
  </script>
</body>
</html>
