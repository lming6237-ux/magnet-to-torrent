<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>磁力链接转 Torrent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 30px 20px; background: #f6f8fa; color: #1f2328; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 24px; }
    .sub { color: #57606a; font-size: 14px; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 24px; }
    label { display: block; font-size: 13px; color: #424a53; margin-bottom: 6px; font-weight: 500; }
    input[type=text] { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 12px; font-family: ui-monospace, monospace; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { padding: 10px 24px; font-size: 14px; background: #2da44e; color: #fff; border: 1px solid rgba(27,31,36,0.15); border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover:not(:disabled) { background: #2c974b; }
    button:disabled { background: #81b196; cursor: not-allowed; }
    #result { margin-top: 20px; padding: 16px; background: #f6f8fa; border-radius: 6px; min-height: 40px; word-break: break-all; border: 1px solid #d0d7de; }
    .ok { color: #1a7f37; font-weight: 600; }
    .err { color: #cf222e; font-weight: 600; }
    .log { margin-top: 16px; padding: 12px; background: #0d1117; color: #8b949e; font-family: ui-monospace, monospace; font-size: 12px; border-radius: 6px; max-height: 260px; overflow-y: auto; }
    .log div { line-height: 1.8; }
    .log .ok { color: #3fb950; }
    .log .warn { color: #d29922; }
    .log .err { color: #f85149; }
    .download-btn { display: inline-block; margin: 6px 6px 6px 0; padding: 10px 16px; background: #0969da; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 13px; cursor: pointer; border: none; }
    .download-btn:hover { background: #0759b5; }
    .download-btn.alt { background: #6e7781; }
    .download-btn.alt:hover { background: #57606a; }
    .download-btn.green { background: #2da44e; }
    .download-btn.green:hover { background: #2c974b; }
    .examples { margin-top: 16px; font-size: 12px; color: #57606a; }
    .examples code { background: #eaeef2; padding: 2px 6px; border-radius: 4px; }
    .progress { width: 100%; height: 6px; background: #d0d7de; border-radius: 3px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: #2da44e; width: 0; transition: width .3s; }
    .url-box { margin-top: 12px; padding: 10px; background: #fff; border: 1px solid #d0d7de; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
    .copy-btn { padding: 4px 12px; font-size: 12px; background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; border-radius: 4px; cursor: pointer; }
    .copy-btn:hover { background: #eaeef2; }
    .tip { margin-top: 16px; padding: 12px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 6px; font-size: 13px; color: #856404; }
    .download-section { margin-top: 12px; }
    .download-section h4 { margin: 8px 0; font-size: 13px; color: #57606a; font-weight: 500; }
    .method-label { font-size: 11px; display: inline-block; margin-left: 6px; padding: 2px 6px; background: #eaeef2; border-radius: 4px; color: #57606a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 磁力链接转 Torrent 文件</h1>
    <div class="sub">通过公共缓存源获取 torrent 元数据</div>
    
    <div class="card">
      <label for="magnet">磁力链接 / info hash</label>
      <input id="magnet" type="text" placeholder="magnet:?xt=urn:btih:4A3F5E08BCEF825718EDA30637230585E3330599" />
      <div class="row">
        <button id="btn" onclick="convert()">开始转换</button>
      </div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="examples">
        测试示例：<code>4A3F5E08BCEF825718EDA30637230585E3330599</code> (Ubuntu镜像)
      </div>
      <div id="result" style="display:none"></div>
      <div class="log" id="log"></div>
    </div>
  </div>
  
  <form id="downloadForm" action="/api/torrent" method="POST" target="_blank" style="display:none">
    <input type="hidden" name="hash" id="formHash" />
  </form>
  
  <script>
    let progressTimer = null;
    function log(msg, type) {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      if (type) line.className = type;
      const t = new Date().toTimeString().slice(0, 8);
      line.textContent = '[' + t + '] ' + msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }
    function startProgress() {
      let pct = 0;
      const f = document.getElementById('progressFill');
      progressTimer = setInterval(() => { pct = Math.min(pct + Math.random() * 3, 95); f.style.width = pct + '%'; }, 300);
    }
    function stopProgress(s) {
      if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
      document.getElementById('progressFill').style.width = (s ? 100 : 0) + '%';
    }
    function parseMagnet(input) {
      input = (input || '').trim();
      if (/^[a-fA-F0-9]{40}$/.test(input)) return input.toUpperCase();
      const m = input.match(/xt=urn:btih:([a-fA-F0-9]{40})/);
      if (m) return m[1].toUpperCase();
      return null;
    }
    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch(e) {
        return false;
      }
    }
    
    async function downloadWithBlob(hash) {
      log('方式1: blob下载 hash=' + hash);
      const resp = await fetch('/api/torrent?hash=' + hash, { cache: 'no-store' });
      if (!resp.ok) { alert('下载失败'); return; }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = hash + '.torrent';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
      log('blob下载完成', 'ok');
    }
    
    function downloadViaWindowOpen(hash) {
      log('方式2: window.open下载 hash=' + hash);
      window.open('/api/torrent?hash=' + hash, '_blank');
    }
    
    async function convert() {
      const raw = document.getElementById('magnet').value;
      const hash = parseMagnet(raw);
      const btn = document.getElementById('btn');
      const resultEl = document.getElementById('result');
      resultEl.style.display = 'block';
      resultEl.innerHTML = '';
      if (!hash) {
        resultEl.innerHTML = '<span class="err">请输入有效的磁力链接或 40 位 info hash</span>';
        log('输入无效', 'err');
        return;
      }
      btn.disabled = true;
      btn.textContent = '转换中...';
      startProgress();
      log('解析 hash: ' + hash);
      log('正在从缓存源获取 torrent 文件...');
      try {
        const downloadUrl = '/api/torrent?hash=' + hash;
        const fullUrl = window.location.origin + downloadUrl;
        
        const resp = await fetch(downloadUrl, { cache: 'no-store' });
        stopProgress(true);
        
        if (!resp.ok) {
          let msg = '转换失败';
          try { const j = await resp.json(); if (j.error) msg = j.error; } catch(e) {}
          resultEl.innerHTML = '<span class="err">✗ ' + msg + '</span><br/><br/><em style="color:#57606a">提示: 冷门或刚发布的资源可能还没被公共缓存收录。</em>';
          log('失败: ' + msg, 'err');
          return;
        }
        
        const blob = await resp.blob();
        const sizeKB = (blob.size / 1024).toFixed(2);
        log('成功! 大小: ' + sizeKB + ' KB', 'ok');
        
        // 保存到页面变量，供按钮使用
        window._currentBlob = blob;
        window._currentHash = hash;
        
        resultEl.innerHTML = `
          <span class="ok">✓ 转换成功</span><br/><br/>
          Hash: <code>${hash}</code><br/>
          大小: ${sizeKB} KB
          <div class="download-section">
            <h4>📥 点击下载</h4>
            <div>
              <button class="download-btn green" onclick="downloadWithBlob('${hash}')">⬇ 下载 .torrent 文件</button>
            </div>
          </div>
          <div class="url-box">
            下载链接: ${fullUrl}
            <button class="copy-btn" onclick="copyToClipboard('${fullUrl}').then(s => alert(s?'已复制!':'复制失败'))">复制</button>
          </div>
          <div class="url-box">
            curl: <code>curl "${fullUrl}" -o ${hash}.torrent</code>
            <button class="copy-btn" onclick="copyToClipboard('curl \\"${fullUrl}\\" -o ${hash}.torrent').then(s => alert(s?'已复制!':'复制失败'))">复制</button>
          </div>
        `;
      } catch(err) {
        stopProgress(false);
        resultEl.innerHTML = '<span class="err">✗ 请求错误: ' + err.message + '</span>';
        log('请求错误: ' + err.message, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = '开始转换';
      }
    }
    document.getElementById('magnet').addEventListener('keypress', (e) => { if (e.key === 'Enter') convert(); });
  </script>
</body>
</html>
